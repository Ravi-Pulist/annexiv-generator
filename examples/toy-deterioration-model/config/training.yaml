# Training configuration for the toy deterioration early-warning classifier.
#
# This file is the single source of truth for the seed and the split ratios:
# data/generate.py and train.py both read it, so the data and the model can
# never drift apart on those parameters.

seed: 20260804

data:
  n_raw_encounters: 4400
  selection:
    # Documented selection criterion (Annex IV 2(d)). Encounters observed for
    # less than this many hours cannot express a deterioration trajectory and
    # are excluded before splitting.
    min_observation_hours: 6.0
  cleaning:
    # Fixed physiological bounds used to winsorise device/charting artefacts.
    # These are constants, not data-derived, so no information leaks across
    # the splits.
    bounds:
      heart_rate: [20.0, 220.0]
      systolic_bp: [50.0, 250.0]
      diastolic_bp: [25.0, 150.0]
      respiratory_rate: [4.0, 60.0]
      spo2: [50.0, 100.0]
      temperature: [30.0, 43.0]
      wbc: [0.1, 60.0]
      lactate: [0.2, 20.0]
      creatinine: [10.0, 900.0]
    # Missing values are imputed with the TRAIN-split median only; the same
    # constants are then applied to val and test.
    impute: train_median
  splits:
    train: 0.6
    val: 0.2
    test: 0.2
  stratify_on: label

model:
  type: logistic_regression
  # Standardised since v0.2.0. The features span 0.2 mmol/L to 900 umol/L, so
  # an unscaled L2 penalty was effectively regularising creatinine into
  # irrelevance and leaving lactate almost unpenalised.
  standardize: true
  penalty: l2
  # 0.35 rather than 1.0. Chosen on the validation split; the difference in
  # validation AUROC across C in [0.1, 3.0] is well inside the fold-to-fold
  # spread, so this is "not obviously wrong" rather than "optimal".
  C: 0.35
  # The decisive change. At a 13.7% positive rate an unweighted fit puts its
  # decision boundary where almost nothing is flagged.
  class_weight: balanced
  solver: lbfgs
  max_iter: 2000

operating_point:
  # v0.1.0 used a fixed 0.5, which produced 0.279 sensitivity -- a screen that
  # missed seven deteriorations in ten. The threshold is now derived from the
  # quantity that actually matters, on the validation split only.
  strategy: target_sensitivity
  # 0.70, not higher. The trade-off curve on validation is steep: 0.70 costs a
  # 43% alert rate, 0.75 costs 61% and 0.80 costs 70%. Past roughly 0.70 the
  # screen is flagging most of the ward, and sensitivity bought by flagging
  # everyone is nominal -- nobody acts on a marker that is always lit. See
  # docs/metric-rationale.md and risk-log.yaml R-01.
  target_sensitivity: 0.70
  selected_on: val
